<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungkan Akun | KelzNex</title>
    <link rel="icon" href="assets/favicon.png">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="video-bg">
        <video autoplay muted loop playsinline>
            <source src="assets/background.mp4" type="video/mp4">
        </video>
    </div>
    <div class="login-card">
        <img src="assets/logo.png" alt="KelzNex" class="card-logo">
        <h2>Hubungkan Akun TikTok</h2>
        <p>Alat resmi untuk akun registered saja</p>

        <button class="btn-tiktok" id="btnMasuk">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
            </svg>
            Mulai Hubungkan
        </button>

        <div class="info-bantuan">
            💡 Pilih <b>"Lanjutkan dengan Google"</b> atau klik <b>"Lanjutkan sebagai [Nama Kamu]"</b>
        </div>

        <div class="tautan-bawah">
            <a href="syarat.html" class="link">Syarat Layanan</a>
            <span>|</span>
            <a href="kebijakan.html" class="link">Kebijakan Privasi</a>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
